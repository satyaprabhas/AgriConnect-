services:
  # 1. The Node.js Backend Server
  - type: web
    name: agriconnect-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://agriconnect-frontend.onrender.com

  # 2. The React Frontend Static Site
  - type: web
    name: agriconnect-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://agriconnect-backend.onrender.com/api
      - key: VITE_UPLOADS_URL
        value: https://agriconnect-backend.onrender.com/uploads
